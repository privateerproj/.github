header:
  schema-version: 2.2.0
  last-updated: '2026-10-01'
  last-reviewed: '2026-10-01'
  url: https://raw.githubusercontent.com/privateerproj/.github/refs/heads/main/.github/security-insights.yml
  comment: |
    This file contains the security insights information for the Privateer project.

project:
  name: Privateer
  homepage: https://github.com/privateerproj
  administrators:
    - name: Eddie Knight
      affiliation: Sonatype
      social: https://bsky.app/profile/eddieknight.dev
      primary: true
  documentation:
    quickstart-guide: https://github.com/privateerproj/pvtr/blob/main/README.md
    detailed-guide: https://github.com/privateerproj/pvtr/blob/main/README.md
    code-of-conduct: https://github.com/privateerproj/.github/blob/main/.github/CODE_OF_CONDUCT.md
  repositories:
    - name: Privateer
      url: https://github.com/privateerproj/pvtr
      comment: |
        Privateer is the core executable that orchestrates community-built plugins.
    - name: Privateer SDK
      url: https://github.com/privateerproj/privateer-sdk
      comment: |
        The Privateer SDK is a collection of tools and libraries to help developers create plugins for Privateer,
        and enables those plugins to be called from Privateer.
    - name: Privateer Homebrew Tap
      url: https://github.com/privateerproj/homebrew-tap
      comment: |
        The Homebrew tap that distributes the pvtr CLI.
    - name: Privateer Website
      url: https://github.com/privateerproj/site
      comment: |
        Source for the privateerproj.com website.
    - name: Privateer Plugin Example
      url: https://github.com/privateerproj/plugin-example
      comment: |
        A boilerplate plugin that shows the quickest way to build a Privateer plugin.
    - name: Privateer Plugin Generator Templates
      url: https://github.com/privateerproj/plugin-generator-templates
      comment: |
        Templates that `pvtr generate-plugin` uses to generate a new plugin from a Gemara control catalog.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Jason Meridth
      social: https://github.com/jmeridth
      primary: true
    policy: https://github.com/privateerproj/.github/blob/main/.github/SECURITY.md
